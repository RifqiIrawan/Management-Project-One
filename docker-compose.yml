services:
  db:
    image: postgres:16-alpine
    container_name: mpo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mpo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
      POSTGRES_DB: ${DB_NAME:-management_project_one}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
